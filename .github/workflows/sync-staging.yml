name: Sync staging with main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into staging
        run: |
          git fetch origin main
          git merge origin/main --no-edit && git push origin staging || {
            git merge --abort
            gh pr create \
              --base staging \
              --head main \
              --title "sync: merge main into staging" \
              --body "Auto-merge failed due to conflicts. Resolve manually."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
